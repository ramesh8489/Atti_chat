version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: atti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atti_secret}
      POSTGRES_DB: ${POSTGRES_DB:-atti_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atti_user -d atti_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Distributed Presence and Socket Scaling
  redis:
    image: redis:7-alpine
    container_name: atti_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Coturn TURN/STUN Server for WebRTC NAT Traversal (Phase 5)
  coturn:
    image: coturn/coturn:latest
    container_name: atti_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49170:49152-49170/udp"
    environment:
      - DETECT_EXTERNAL_IP=yes
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=49170
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-atti_turn_secret_placeholder}
      - --realm=${TURN_REALM:-atti.local}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
